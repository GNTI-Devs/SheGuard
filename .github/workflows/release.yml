name: Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Rename APK to versioned name
        run: |
          cp "${{ steps.find_apk.outputs.path }}" "SheGuard-Android-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SheGuard AI — ${{ github.ref_name }}"
          prerelease: false
          body: |
            ## 📲 Download SheGuard AI (${{ github.ref_name }})

            ### Android
            Download the **SheGuard-Android-${{ github.ref_name }}.apk** file below.

            **How to install:**
            1. Download the `.apk` file to your Android phone.
            2. Open your phone's **Files** app and locate the downloaded file.
            3. Tap the file — if prompted, allow installation from unknown sources.
            4. Tap **Install** and you're done! 🎉

            ### iOS
            iOS builds are not yet available for direct download.
            If you have a Mac and Xcode installed, you can build from source — see the [README](https://github.com/GNTI-Devs/SheGuard#-getting-started).

            ---
            *Built automatically from tag `${{ github.ref_name }}`*
          files: "SheGuard-Android-${{ github.ref_name }}.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
