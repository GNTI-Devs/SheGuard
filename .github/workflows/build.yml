name: Build Mobile App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: List APK output files
        run: find android/app/build/outputs/apk -name "*.apk" | tee /tmp/apk_list.txt

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheguard-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Generate iOS Native Directory (Expo Prebuild)
        run: bunx expo prebuild --no-install --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App via Xcode
        run: |
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Xcode Workspace: $WORKSPACE with Scheme: $SCHEME"
          cd ios
          xcodebuild \
            -workspace "$(basename "$WORKSPACE")" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Compress iOS App Bundle
        run: |
          PRODUCTS_DIR=$(find ios/build/Build/Products -maxdepth 1 -name "*iphonesimulator" -type d | head -n 1)
          echo "Products directory: $PRODUCTS_DIR"
          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 1 -name "*.app" | head -n 1)
          echo "Compressing iOS App package: $APP_PATH"
          zip -r ios/SheGuard-iOS-Simulator.zip "$APP_PATH"

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheguard-ios-release
          path: ios/SheGuard-iOS-Simulator.zip
          if-no-files-found: error
